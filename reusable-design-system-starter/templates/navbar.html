{% set brand_name = brand_name | default("Starter Brand") %}
{% set brand_href = brand_href | default("#") %}
{% set menu_label = menu_label | default("Menu") %}
{% set nav_items = nav_items | default([]) %}

<nav class="ui-navbar" aria-label="Main navigation">
  <div class="ui-page-wrap ui-navbar__inner">
    <a href="{{ brand_href }}" class="ui-navbar__brand">
      <span class="ui-navbar__brand-accent">{{ brand_name }}</span>
    </a>

    <button
      type="button"
      class="ui-navbar__toggle"
      data-navbar-toggle=".ui-navbar__nav"
      aria-expanded="false"
      aria-controls="ui-navbar-nav"
      aria-label="{{ menu_label }}"
    >
      {{ menu_label }}
    </button>

    <div id="ui-navbar-nav" class="ui-navbar__nav" hidden>
      {% for item in nav_items %}
        <a
          href="{{ item.href | default('#') }}"
          class="ui-navbar__link{% if item.active %} is-active{% endif %}"
        >
          {{ item.label }}
        </a>
      {% endfor %}
    </div>
  </div>
</nav>
