<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Demo</title>
  <link rel="stylesheet" href="../tokens/colors.css">
  <link rel="stylesheet" href="../tokens/spacing.css">
  <link rel="stylesheet" href="../tokens/radius.css">
  <link rel="stylesheet" href="../tokens/shadows.css">
  <link rel="stylesheet" href="../tokens/typography.css">
  <link rel="stylesheet" href="../themes/starter-theme.css">
  <link rel="stylesheet" href="../components/layout.css">
  <link rel="stylesheet" href="../components/cards.css">
  <link rel="stylesheet" href="../components/buttons.css">
  <link rel="stylesheet" href="../components/forms.css">
  <link rel="stylesheet" href="../components/password-field.css">
  <link rel="stylesheet" href="../components/alerts.css">
  <link rel="stylesheet" href="../components/navbar.css">
  <link rel="stylesheet" href="../responsive/mobile.css">
</head>
<body class="ui-shell">
  <main class="ui-page-wrap ui-section-stack" style="max-width: 34rem; margin: 3rem auto;">
    <div class="ui-card">
      <div class="ui-card-body">
        <div class="ui-field">
          <label class="ui-label" for="demo-user">Username</label>
          <input
            id="demo-user"
            class="ui-input"
            type="text"
            placeholder="Enter username"
            data-validation-profile="username"
            data-validation-label="Username"
            minlength="3"
            maxlength="30"
          >
        </div>
        <div class="ui-field">
          <label class="ui-label" for="demo-password">Password</label>
          <div class="ui-password-field password-field-group">
            <button
              class="ui-password-toggle password-toggle-btn"
              type="button"
              data-password-toggle="demo-password"
              data-show-label="Show password"
              data-hide-label="Hide password"
              aria-label="Show password"
            >
              Show
            </button>
            <input
              id="demo-password"
              class="ui-input"
              type="password"
              placeholder="Enter password"
              data-validation-profile="password"
              data-validation-label="Password"
              minlength="6"
              maxlength="64"
            >
          </div>
        </div>
        <button class="ui-btn ui-btn--primary" type="button">Sign in</button>
      </div>
    </div>
  </main>
  <script type="module">
    import { initPasswordToggles } from "../js/password-toggle.js";
    import { createValidationKit, defaultProfiles } from "../js/validation.js";

    initPasswordToggles();
    createValidationKit({ profiles: defaultProfiles }).init();
  </script>
</body>
</html>
